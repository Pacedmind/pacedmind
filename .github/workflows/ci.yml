# Checks every pull request and every push to master the way a fresh clone builds: the app, the site and
# the docs are three projects with their own dependencies, and the billing functions run on Deno.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Without install scripts: the checks and the build don't need Electron's own download.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:models
      - run: npm run test:sessions
      - run: npm run test:auth
      - run: npm run test:sql
      - run: npm run test:connectors
      # The plugin's copies of the skills, its manifests, and the tools' annotation sheet (deploy/directory).
      - run: npm run plugins -- --check
      - run: npm run directory:tools -- --check
      - run: npm run test:platforms
      - run: npm run lint
      - run: npm run build

  site:
    name: Site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

  docs:
    name: Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the sitemap dates each page from its last commit
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build

  functions:
    name: Billing functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v7
      # They run on Deno in Supabase, not on Node: deno.json here keeps Deno away from the app's node_modules.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check billing-checkout/index.ts billing-portal/index.ts stripe-webhook/index.ts

  mobile:
    name: Mobile source and bundles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run bundle
